# Дополнение к docker-compose.yml Supabase для СамМари.
# Подключается через COMPOSE_FILE=docker-compose.yml:docker-compose.sammari.yml в .env
services:
  # Наружу ничего не публикуем: к шлюзу ходит наш Caddy по внутренней сети,
  # к базе — только контейнеры. Docker обходит ufw, поэтому порты убираем явно.
  api-gw:
    ports: !reset []
  supavisor:
    ports: !reset []

  auth:
    environment:
      # письмо с 6-значным кодом вместо ссылки
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: https://api.sum-mary.ru/email/code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: https://api.sum-mary.ru/email/code.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Код входа в СамМари"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Код входа в СамМари"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
