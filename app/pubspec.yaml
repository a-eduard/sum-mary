name: sammari
description: "СамМари — ИИ-ассистент Мари: запись встреч и звонков, расшифровка, резюме и задачи."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  share_plus: ^10.1.0
  permission_handler: ^11.3.1
  http: ^1.2.2
  intl: any
  url_launcher: ^6.3.0
  flutter_rustore_pay: ^11.1.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  add_2_calendar: ^3.0.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F1015"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
