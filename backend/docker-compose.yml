# Сервер обработки СамМари. Supabase поднимается отдельно (см. docs/DEPLOY.md).
services:
  worker:
    build: .
    image: sammari-backend:latest
    env_file: .env
    restart: unless-stopped
    command: python -m app.worker
    networks: [default, supabase]
  # «Быстрая полоса»: только короткие записи (до 15 мин), чтобы они не ждали длинные лекции
  worker-fast:
    image: sammari-backend:latest
    depends_on: [worker]
    env_file: .env
    environment:
      WORKER_MAX_SEC: "900"
      NUM_THREADS: "2"
    restart: unless-stopped
    command: python -m app.worker
    networks: [default, supabase]
  api:
    image: sammari-backend:latest   # тот же образ, что и worker (собирается один раз)
    depends_on: [worker]
    env_file: .env
    restart: unless-stopped
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --workers 2
    networks: [default, supabase]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../landing:/srv/landing:ro
      - caddy_data:/data
    networks: [default, supabase]
volumes:
  caddy_data:
networks:
  supabase:
    external: true
    name: supabase_default
